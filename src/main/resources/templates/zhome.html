<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #000;
            background-color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #f0f0f0;
            padding: 10px 20px;
            border-bottom: 1px solid #ccc;
        }
        nav div {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
        }
        nav a:hover {
            background-color: #ddd;
            border-radius: 4px;
        }
        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.5em;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <div>
            <a href="/" >Home</a>
            <a href="/available-posts" >Available Posts</a>
            <a href="/newpost" >Create Post</a>
        </div>
    </nav>
</header>

<main>
    <h1>WELCOME TO BLOG APPLICATION</h1>
    <p>
        Welcome to the world of ideas and creativity! Dive into stories, articles, and thoughts that explore various topics. Discover the joy of writing and the beauty of expression.
    </p>
</main>
</body>
</html>
