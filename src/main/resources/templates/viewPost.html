<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">View Post</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>

<body class="bg-light">
<div class="container mt-5">
    <a href="/home" class="btn btn-link mb-3">&larr; Back to all posts</a>

    <div class="card p-4 shadow-sm">
        <h2 th:text="${post.title}" class="mb-2"></h2>
        <p class="text-muted">
            by <span th:text="${post.user.name}"></span>
        </p>

        <div class="mb-3">
            <span th:each="tag : ${post.tags}" class="badge badge-info mr-1"
                  th:text="${tag.name}"></span>
        </div>

        <p th:text="${post.content}" class="lead"></p>

        <hr>
        <div class="mt-3">
            <a th:href="@{'/editPost/' + ${post.id}}" class="btn btn-warning btn-sm">Update</a>
            <a th:href="@{'/deletePost/' + ${post.id}}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Are you sure you want to delete this post?');">Delete</a>
        </div>
    </div>
</div>
</body>
</html>
