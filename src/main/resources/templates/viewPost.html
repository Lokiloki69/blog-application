<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">View Post</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; color: black; max-width: 800px; margin: 40px auto; }
        a, button { background: gray; color: white; padding: 6px 12px; border: none; text-decoration: none; cursor: pointer; }
        h2, h4, h5 { margin-top: 20px; }
        .comment-box, .post-box { border: 1px solid #ccc; padding: 12px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 6px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: bold; }
    </style>
</head>
<body>
<a href="/">&larr; Back to all posts</a>

<div class="post-box">
    <h2 th:text="${post.title}"></h2>
<!--    <p>by <span th:text="${post.user.name}"></span></p>-->
    <p class="author">
        by <strong th:text="${post.user != null ? post.user.name : 'Anonymous'}"></strong>
        &nbsp;•&nbsp;
        <span th:text="${#dates.format(post.publishedAt, 'dd MMM yyyy, hh:mm a')}"></span>
    </p>

    <div>
        <span th:each="tag : ${post.tags}" th:text="${tag.name} + ' '" style="font-style: italic;"></span>
    </div>
    <p th:text="${post.content}"></p>

    <div>
        <a th:href="@{'/editPost/' + ${post.id}}"
           th:if="${post.user.email == #authentication.name or #authorization.expression('hasRole(''ADMIN'')')}">
            Update
        </a>
        <a th:href="@{'/deletePost/' + ${post.id}}"
           th:if="${post.user.email == #authentication.name or #authorization.expression('hasRole(''ADMIN'')')}"
           onclick="return confirm('Are you sure you want to delete this post?');">
            Delete
        </a>
    </div>

</div>

<hr>
<h3>Comments</h3>
<div th:each="comment : ${comments}" class="comment-box">
    <strong th:text="${comment.name}"></strong> (<span th:text="${comment.email}"></span>)
    <p th:text="${comment.content}"></p>

    <div th:if="${(comment.user != null and comment.user.email == #authentication.name)
                  or (comment.post.user.email == #authentication.name)
                  or #authorization.expression('hasRole(''ADMIN'')')}">
        <a th:href="@{'/comment/edit/' + ${comment.id}}">Edit</a>
        <a th:href="@{'/comment/delete/' + ${comment.id}}"
           onclick="return confirm('Delete this comment?');">Delete</a>
    </div>
</div>



<h3>Leave a Comment</h3>
<form th:action="@{'/comment/add/' + ${post.id}}" method="post">
    <div th:if="${#authentication.name == 'anonymousUser'}">
        <input type="text" name="name" placeholder="Your Name" required><br>
        <input type="email" name="email" placeholder="Your Email" required><br>
    </div>
    <textarea name="content" placeholder="Write your comment..." required></textarea><br>
    <button type="submit">Submit</button>
</form>
</body>
</html>
