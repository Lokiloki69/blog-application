<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">View Post</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; color: black; max-width: 800px; margin: 40px auto; }
        a, button { background: gray; color: white; padding: 6px 12px; border: none; text-decoration: none; cursor: pointer; }
        h2, h4, h5 { margin-top: 20px; }
        .comment-box, .post-box { border: 1px solid #ccc; padding: 12px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 6px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: bold; }
    </style>
</head>
<body>
<a href="/home">&larr; Back to all posts</a>

<div class="post-box">
    <h2 th:text="${post.title}"></h2>
    <p>by <span th:text="${post.user.name}"></span></p>
    <div>
        <span th:each="tag : ${post.tags}" th:text="${tag.name} + ' '" style="font-style: italic;"></span>
    </div>
    <p th:text="${post.content}"></p>

    <div>
        <a th:href="@{'/editPost/' + ${post.id}}">Update</a>
        <a th:href="@{'/deletePost/' + ${post.id}}"
           onclick="return confirm('Are you sure you want to delete this post?');">Delete</a>
    </div>
</div>

<h4>Comments</h4>
<div th:if="${#lists.isEmpty(comments)}">
    <p>No comments yet. Be the first to comment!</p>
</div>

<div th:each="comment : ${comments}" class="comment-box">
    <strong th:text="${comment.name}"></strong> (<span th:text="${comment.email}"></span>)
    <p th:text="${comment.commentContent}"></p>
    <div>
        <a th:href="@{'/comment/edit/' + ${comment.id}}">Edit</a>
        <a th:href="@{'/comment/delete/' + ${comment.id}}"
           onclick="return confirm('Delete this comment?');">Delete</a>
    </div>
</div>

<div class="comment-box">
    <h5>Leave a Comment</h5>
    <form th:action="@{'/post/' + ${post.id} + '/comment'}" th:object="${newComment}" method="post">
        <label for="name">Name</label>
        <input id="name" type="text" th:field="*{name}" required>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" required>

        <label for="comment">Comment</label>
        <textarea id="comment" th:field="*{commentContent}" rows="3" required></textarea>

        <button type="submit">Post Comment</button>
    </form>
</div>
</body>
</html>
