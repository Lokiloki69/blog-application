<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Posts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #000;
            margin: 40px;
        }
        .top-bar, .search-sort-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        button, input[type="text"], select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            background-color: #f5f5f5;
            color: #000;
        }
        button:hover {
            background-color: #ddd;
            cursor: pointer;
        }
        a.button {
            padding: 6px 10px;
            text-decoration: none;
            color: #000;
            border: 1px solid #ccc;
            background-color: #f5f5f5;
        }
        a.button:hover {
            background-color: #ddd;
        }
        .post-card {
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
<div class="top-bar">
    <div>
        <a href="/" class="button">Home</a>
    </div>
    <div>
        <a href="/newpost" class="button">New Post</a>
    </div>
</div>

<div class="search-sort-bar">
    <form th:action="@{/?}" method="get" style="display:inline-flex; gap:8px; align-items:center;">
        <input type="text" name="query" th:value="${searchQuery}" placeholder="Search posts..." />
        <button type="submit">Apply</button>
    </form>
    <form th:action="@{/?}" method="get" style="display:inline-flex; gap:8px; align-items:center;">
        <input type="hidden" name="query" th:if="${searchQuery != null and searchQuery != ''}" th:value="${searchQuery}">

        <select name="sort">
            <option value="">Sort</option>
            <option value="new" th:selected="${sortOrder == 'new'}">New to Old</option>
            <option value="old" th:selected="${sortOrder == 'old'}">Old to New</option>
            <option value="title" th:selected="${sortOrder == 'title'}">Title A-Z</option>
        </select>

        <div th:if="${param.tagId != null}">
            <input type="hidden" name="tagId" th:each="t : ${param.tagId}" th:value="${t}">
        </div>
        <div th:if="${param.authorId != null}">
            <input type="hidden" name="authorId" th:each="a : ${param.authorId}" th:value="${a}">
        </div>
        <button type="submit">Apply</button>
    </form>
    <form th:action="@{/?}" method="get" style="display:flex; gap:10px; align-items:center;">
        <input type="hidden" name="query" th:if="${searchQuery != null and searchQuery != ''}" th:value="${searchQuery}">
        <input type="hidden" name="sort" th:if="${sortOrder != null and sortOrder != ''}" th:value="${sortOrder}">
        <label for="authorId">Author</label>
        <select id="authorId" name="authorId" multiple>
            <option value="">All</option>
            <option th:each="user : ${authors}" th:value="${user.id}" th:selected="${authorId == user.id}" th:text="${user.name}"></option>
        </select>


        <label for="tagId">Tags</label>
        <select id="tagId" name="tagId" multiple >
            <option th:each="tag : ${allTags}" th:value="${tag.id}"
                    th:selected="${tagIds != null ? tagIds.contains(tag.id) : false}"
                    th:text="${tag.name}"></option>
        </select>

        <button type="submit">Apply</button>
    </form>

</div>

<div th:if="${searchQuery != null}">
    <h5>Showing results for: "<span th:text="${searchQuery}"></span>"</h5>
</div>

<div th:if="${#lists.isEmpty(posts)}">
    <p>No posts available...</p>
</div>

<div th:each="post : ${posts}" class="post-card">
    <h3 th:text="${post.title}"></h3>
    <p><strong th:text="${post.user != null ? post.user.name : 'Anonymous'}"></strong></p>
    <p th:text="${post.excerpt}"></p>
    <a th:href="@{'/post/' + ${post.id}}" class="button">Read</a>
</div>
</body>
</html>
