<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Posts</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>

<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>All Blog Posts</h2>
        <a href="/newpost" class="btn btn-primary">+ New Post</a>
    </div>

    <div th:if="${#lists.isEmpty(posts)}">
        <p>No posts available yet. Be the first to create one!</p>
    </div>

    <div th:each="post : ${posts}" class="card mb-4 shadow-sm">
        <div class="card-body">
            <h4 th:text="${post.title}" class="card-title"></h4>
            <small class="text-muted" th:text="${post.user != null ? post.user.name : 'Anonymous'}"></small>
            <p th:text="${post.excerpt}" class="card-text mt-2"></p>

            <div class="mb-2">
                <span th:each="tag : ${post.tags}" class="badge badge-info mr-1"
                      th:text="${tag.name}"></span>
            </div>

            <a th:href="@{'/post/' + ${post.id}}" class="btn btn-outline-primary btn-sm">Read</a>
        </div>
    </div>
</div>
</body>
</html>
