<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Posts</title>
    <style>
        body {font-family: Arial, sans-serif; color: #222; margin: 0; background: #fcfcfc;}
        .container {width: 94%; margin: 22px auto 0 auto;}
        .top-actions {display: flex; gap: 22px; margin-bottom: 18px;}
        .top-actions a {background: #f5f5f5; border: 1px solid #ccc; color: #151e57; padding: 8px 16px; text-decoration: none; border-radius: 3px;}
        .top-actions a:hover {background: #e7e7ea;}
        .inline-filters {display: flex; gap: 18px; align-items: center; margin-bottom: 32px;}
        .inline-filters select, .inline-filters input[type="text"] {padding: 7px 10px; border: 1px solid #ccc;}
        .inline-filters button {padding: 7px 16px; border: 1px solid #ccc; background: #f5f5f5; color: #222;}
        .inline-filters button:hover {background: #ededfa;}
        .main-section {display: flex;}
        .sidebar {min-width: 220px; background: #fafafe; border-right: 1px solid #e7e7ea; padding: 16px 10px;}
        .sidebar label {font-weight: bold; margin-bottom: 9px; display: block;}
        .sidebar .checkbox-list {margin-bottom: 30px;}
        .checkbox-list ul {list-style: none; padding: 0;}
        .checkbox-list li {margin-bottom: 7px;}
        .checkbox-list input[type="checkbox"] {margin-right: 7px;}
        .posts-list {flex: 1; padding: 0 0 0 36px;}
        .post-card {border: 1px solid #ddd; background: #fff; padding: 16px 15px; margin-bottom: 18px;}
        .post-card h3 {margin: 0 0 7px 0;}
        .post-card .author {font-size: .97em; color: #666;}
        .post-card .excerpt {margin: 7px 0;}
        .post-card .read-btn {font-size: .97em; padding: 6px 10px; border: 1px solid #ccc; background: #f5f5f5; color: #222; text-decoration: none;}
        .post-card .read-btn:hover {background: #ecedfa;}
        .pagination {margin-top: 38px; text-align: center;}
        .pagination .page-link {display: inline-block; margin: 0 8px; padding: 7px 18px; background: #f4f4fa; border: 1px solid #ddd; color: #333; text-decoration: none;}
        .pagination .page-link.active, .pagination .page-link:focus {background: #e7e7fa; font-weight: bold;}
    </style>
</head>
<body>
<div class="container">
    <div class="top-actions">
        <a href="/" >Home</a>
        <a href="/newpost">New Post</a>
    </div>

    <form th:action="@{/?}" method="get" class="inline-filters" style="display:inline-flex; gap:8px; align-items:center;">
        <input type="text" name="query" th:value="${searchQuery}" placeholder="Search posts..."/>
        <button type="submit">Search</button>
    </form>

    <form th:action="@{/?}" method="get" class="inline-filters" style="display:inline-flex; gap:8px; align-items:center; margin-left: 20px;">
        <select name="sort">
            <option value="">Sort</option>
            <option value="new" th:selected="${sortOrder == 'new'}">New to Old</option>
            <option value="old" th:selected="${sortOrder == 'old'}">Old to New</option>
            <option value="title" th:selected="${sortOrder == 'title'}">Title A-Z</option>
        </select>

        <input type="hidden" name="query" th:if="${searchQuery != null and searchQuery != ''}" th:value="${searchQuery}"/>
        <div th:if="${param.tagId != null}">
            <input type="hidden" name="tagId" th:each="t : ${param.tagId}" th:value="${t}"/>
        </div>
        <div th:if="${param.authorId != null}">
            <input type="hidden" name="authorId" th:each="a : ${param.authorId}" th:value="${a}"/>
        </div>

        <button type="submit">Sort</button>
    </form>

    <div class="main-section">
        <aside class="sidebar">
            <form th:action="@{/?}" method="get">

                <input type="hidden" name="query" th:if="${searchQuery != null and searchQuery != ''}" th:value="${searchQuery}">
                <input type="hidden" name="sort" th:if="${sortOrder != null and sortOrder != ''}" th:value="${sortOrder}">
                <input type="hidden" name="query" th:value="${searchQuery}" th:if="${searchQuery != null && searchQuery != ''}">
                <input type="hidden" name="sort" th:value="${sortOrder}" th:if="${sortOrder != null && sortOrder != ''}">

                <div class="checkbox-list">
                    <label>Tags</label>
                    <ul>
                        <li th:each="tag : ${allTags}">
                            <input type="checkbox" name="tagId" th:value="${tag.id}"
                                   th:checked="${tagIds != null ? tagIds.contains(tag.id) : false}">
                            <span th:text="${tag.name}"></span>
                        </li>
                    </ul>
                </div>
                <div class="checkbox-list">
                    <label>Authors</label>
                    <ul>
                        <li th:each="author : ${authors}">
                            <input type="checkbox" name="authorId" th:value="${author.id}"
                                   th:checked="${authorIds != null ? authorIds.contains(author.id) : false}">
                            <span th:text="${author.name}"></span>
                        </li>
                    </ul>
                </div>
                <button type="submit">Apply Filters</button>
            </form>
        </aside>

        <section class="posts-list">
            <div th:if="${searchQuery != null}">
                <h5>Showing results for: "<span th:text="${searchQuery}"></span>"</h5>
            </div>
            <div th:if="${#lists.isEmpty(posts)}">
                <p>No posts available...</p>
            </div>
            <div th:each="post : ${posts}" class="post-card">
                <h3 th:text="${post.title}"></h3>
                <p class="author"><strong th:text="${post.user != null ? post.user.name : 'Anonymous'}"></strong></p>
                <p class="excerpt" th:text="${post.excerpt}"></p>
                <a th:href="@{'/post/' + ${post.id}}" class="read-btn">Read</a>
            </div>

            <div class="pagination">
                <form th:if="${currentPage > 1}" th:action="@{/}" method="get" style="display: inline;">
                    <input type="hidden" name="start" th:value="${start - limit}" />
                    <input type="hidden" name="limit" th:value="${limit}" />
                    <input type="hidden" name="query" th:if="${searchQuery != null and searchQuery != ''}" th:value="${searchQuery}" />
                    <input type="hidden" name="sort" th:if="${sortOrder != null and sortOrder != ''}" th:value="${sortOrder}" />
                    <div th:if="${tagIds != null}">
                        <input type="hidden" name="tagId" th:each="t : ${tagIds}" th:value="${t}" />
                    </div>
                    <div th:if="${authorIds != null}">
                        <input type="hidden" name="authorId" th:each="a : ${authorIds}" th:value="${a}" />
                    </div>
                    <button type="submit" class="page-link">&laquo; Prev</button>
                </form>

                <span class="page-link active" th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}"></span>

                <form th:if="${currentPage < totalPages}" th:action="@{/}" method="get" style="display: inline;">
                    <input type="hidden" name="start" th:value="${start + limit}" />
                    <input type="hidden" name="limit" th:value="${limit}" />
                    <input type="hidden" name="query" th:if="${searchQuery != null and searchQuery != ''}" th:value="${searchQuery}" />
                    <input type="hidden" name="sort" th:if="${sortOrder != null and sortOrder != ''}" th:value="${sortOrder}" />
                    <div th:if="${tagIds != null}">
                        <input type="hidden" name="tagId" th:each="t : ${tagIds}" th:value="${t}" />
                    </div>
                    <div th:if="${authorIds != null}">
                        <input type="hidden" name="authorId" th:each="a : ${authorIds}" th:value="${a}" />
                    </div>
                    <button type="submit" class="page-link">Next &raquo;</button>
                </form>
            </div>


        </section>
    </div>
</div>
</body>
</html>
