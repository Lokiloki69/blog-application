<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create or Edit Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #000;
            background-color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #f0f0f0;
            padding: 10px 20px;
            border-bottom: 1px solid #ccc;
        }
        nav div {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
        }
        nav a:hover {
            background-color: #ddd;
            border-radius: 4px;
        }
        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            display: flex;
            justify-content: flex-start;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"],
        textarea,
        select,
        button {
            font-family: inherit;
            font-size: 1em;
        }
        input[type="text"],
        textarea,
        select {
            padding: 5px;
            border: 1px solid #000;
            border-radius: 2px;
        }
        button {
            padding: 8px;
            border: 1px solid #000;
            border-radius: 2px;
            cursor: pointer;
            background: none;
        }
        button:hover {
            background-color: #eee;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .button-group button {
            flex: 1;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <div>
            <a href="/">Home</a>
            <a href="/available-posts">Available Posts</a>
            <a href="/newpost">Create Post</a>
        </div>
    </nav>
</header>
<main>
    <form th:action="@{${post} != null and ${post.id} != null ? '/posts/' + ${post.id} + '/edit' : '/create-post'}" th:method="post">
        <h1 th:text="${post.id != null ? 'Edit Post' : 'Create Post'}">Create Post</h1>

        <label for="title">Title:</label>
        <input type="text" id="title" name="title" th:value="${post.title}" placeholder="Enter the title" required>

        <label for="excerpt">Excerpt:</label>
        <input type="text" id="excerpt" name="excerpt" th:value="${post.excerpt}" placeholder="Enter the excerpt" required>

        <label for="content">Content:</label>
        <textarea id="content" name="content" rows="5" th:text="${post.content}" placeholder="Enter the content" required></textarea>

        <label for="author">Author:</label>
        <input type="text" id="author" name="author" th:value="${post.author}" placeholder="Enter the author name" required>

        <label for="tags">Tags:</label>
        <select name="tagIds" id="tags" multiple>
            <th:block th:each="tag : ${tags}">
                <option th:value="${tag.id}" th:text="${tag.name}"
                        th:selected="${post.tags.contains(tag) ? 'selected' : ''}"></option>
            </th:block>
        </select>

        <div class="button-group">
            <button type="submit" th:text="${post.id != null ? 'Update Post' : 'Submit'}">Submit</button>
            <button type="submit" name="publish" value="true" th:text="${post.id != null ? 'Update and Publish' : 'Publish'}">Publish</button>
        </div>
    </form>
</main>
</body>
</html>
