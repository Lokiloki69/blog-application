<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${post.id != null ? 'Edit Post' : 'New Post'}">Blog Post</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>

<body class="bg-light">
<div class="container mt-5">
    <a href="/home" class="btn btn-link mb-3">&larr; Back to all posts</a>

    <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center" th:text="${post.id != null ? 'Edit Blog Post' : 'Create New Blog Post'}"></h2>

        <form th:action="${post.id != null} ? @{/updatePost} : @{/savePost}"
              th:object="${post}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" type="text" class="form-control" th:field="*{title}" placeholder="Enter blog title">
            </div>

            <div class="form-group">
                <label for="tags">Tags</label>
                <input id="tags" type="text" class="form-control" name="tagString"
                       th:value="${tagString}" placeholder="Tags (comma separated)">
            </div>

            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" class="form-control" rows="8"
                          th:field="*{content}" placeholder="Write your blog here..."></textarea>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success px-4">
                    <span th:text="${post.id != null ? 'Update Post' : 'Publish Post'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
