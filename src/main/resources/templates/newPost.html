<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${post.id != null ? 'Edit Post' : 'New Post'}">Blog Post</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; color: black; max-width: 700px; margin: 40px auto; }
        a, button { background: gray; color: white; padding: 6px 12px; border: none; text-decoration: none; cursor: pointer; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, textarea { width: 100%; padding: 6px; }
        label { font-weight: bold; }
        h2 { text-align: center; }
    </style>
</head>
<body>
<a href="/">&larr; Back to all posts</a>
<h2 th:text="${post.id != null ? 'Edit Blog Post' : 'Create New Blog Post'}"></h2>

<form th:action="${post.id != null} ? @{/updatePost} : @{/savePost}" th:object="${post}" method="post">
    <input type="hidden" th:field="*{id}">

    <label for="title">Title</label>
    <input id="title" type="text" th:field="*{title}" placeholder="Enter blog title">

    <label for="tags">Tags</label>
    <input id="tags" type="text" name="tagString" th:value="${tagString}" placeholder="Tags (comma separated)">

    <label for="content">Content</label>
    <textarea id="content" rows="8" th:field="*{content}" placeholder="Write your blog here..."></textarea>

    <button type="submit">
        <span th:text="${post.id != null ? 'Update Post' : 'Publish Post'}"></span>
    </button>
</form>
</body>
</html>
